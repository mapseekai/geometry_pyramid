<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>geometry_pyramid demo</title>
        <link href="./maplibre-gl.css" rel="stylesheet" />
        <style>
            html,
            body,
            #map {
                margin: 0;
                height: 100%;
            }
            #hud {
                position: absolute;
                top: 8px;
                left: 8px;
                z-index: 1;
                font: 12px/1.4 monospace;
                background: rgba(0, 0, 0, 0.7);
                color: #fff;
                padding: 6px 8px;
                border-radius: 4px;
            }
            #hud b {
                color: #6cf;
            }
            #hud label {
                display: block;
                margin-top: 5px;
                color: #d6e3ea;
                white-space: nowrap;
            }
            #hud input {
                margin: 0 5px 0 0;
                vertical-align: -2px;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div id="hud">
            z=<b id="z">0</b> · <span id="mode"></span>
            <label
                ><input id="basemap-toggle" type="checkbox" />online
                basemap</label
            >
        </div>
        <script src="./maplibre-gl.js"></script>
        <script>
            const PYRAMID = "points_3857";
            const MAX_ZOOM = 12; // pyramid maxZoom; beyond this -> dynamic slicing
            const BASEMAP_SOURCE_ID = "osm";
            const BASEMAP_LAYER_ID = "osm-raster";
            const BASEMAP_TILES = [
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            ];
            const BASEMAP_ATTRIBUTION =
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
            const map = new maplibregl.Map({
                container: "map",
                style: {
                    version: 8,
                    sources: {
                        pyr: {
                            type: "vector",
                            tiles: [
                                location.origin +
                                    "/tiles/" +
                                    PYRAMID +
                                    "/{z}/{x}/{y}.pbf",
                            ],
                            minzoom: 0,
                            maxzoom: 22,
                        },
                    },
                    layers: [
                        {
                            id: "bg",
                            type: "background",
                            paint: { "background-color": "#11151c" },
                        },
                        {
                            id: "f",
                            type: "line",
                            source: "pyr",
                            "source-layer": PYRAMID,
                            paint: { "line-color": "#ff5a5f", "line-width": 1 },
                        },
                    ],
                },
                center: [120.23, 30.3],
                zoom: 3,
            });
            let styleReady = false;
            map.addControl(new maplibregl.NavigationControl());
            function setBasemapVisible(visible) {
                if (!styleReady) {
                    return;
                }
                if (visible) {
                    if (!map.getSource(BASEMAP_SOURCE_ID)) {
                        map.addSource(BASEMAP_SOURCE_ID, {
                            type: "raster",
                            tiles: BASEMAP_TILES,
                            tileSize: 256,
                            maxzoom: 19,
                            attribution: BASEMAP_ATTRIBUTION,
                        });
                    }
                    if (!map.getLayer(BASEMAP_LAYER_ID)) {
                        map.addLayer(
                            {
                                id: BASEMAP_LAYER_ID,
                                type: "raster",
                                source: BASEMAP_SOURCE_ID,
                            },
                            "f",
                        );
                    }
                    return;
                }
                if (map.getLayer(BASEMAP_LAYER_ID)) {
                    map.removeLayer(BASEMAP_LAYER_ID);
                }
                if (map.getSource(BASEMAP_SOURCE_ID)) {
                    map.removeSource(BASEMAP_SOURCE_ID);
                }
            }
            function updateHud() {
                const z = map.getZoom();
                document.getElementById("z").textContent = z.toFixed(1);
                document.getElementById("mode").textContent =
                    z > MAX_ZOOM ? "DYNAMIC (z > maxZoom)" : "materialized";
            }
            const basemapToggle = document.getElementById("basemap-toggle");
            basemapToggle.addEventListener("change", () => {
                setBasemapVisible(basemapToggle.checked);
            });
            map.on("zoom", updateHud);
            map.on("load", () => {
                styleReady = true;
                updateHud();
                setBasemapVisible(basemapToggle.checked);
            });
        </script>
    </body>
</html>
