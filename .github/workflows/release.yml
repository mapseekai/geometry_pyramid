name: Verify and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Package PostgreSQL 17 extension
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/17/bin/pg_config
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      archive: ${{ steps.archive.outputs.archive }}

    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out the v0.1.0 upgrade baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 846e1a420567d3cec8ae5b61d2f7bc5df14c3e41 # v0.1.0
          path: upgrade-baseline
          persist-credentials: false

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Determine the package version and check release tags
        id: version
        env:
          TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "geometry_pyramid") | .version')"
          expected_tag="v${cargo_version}"

          if [ "${IS_RELEASE}" = "true" ] && [ "${TAG}" != "${expected_tag}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${cargo_version}; expected ${expected_tag}." >&2
            exit 1
          fi

          printf 'tag=%s\n' "${expected_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install PostgreSQL 17 development files
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /tmp/postgresql.asc
          sudo gpg --dearmor --yes --output /etc/apt/keyrings/postgresql.gpg /tmp/postgresql.asc
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-server-dev-17 postgresql-17-postgis-3

      - name: Install cargo-pgrx
        run: cargo install --locked cargo-pgrx --version 0.18.0

      - name: Initialize cargo-pgrx for PostgreSQL 17
        run: cargo pgrx init --pg17 "${PG_CONFIG}"

      - name: Run Rust and PostGIS regressions
        run: |
          sudo chown "$(id -u)" "$("${PG_CONFIG}" --pkglibdir)" "$("${PG_CONFIG}" --sharedir)/extension"
          cargo pgrx test pg17

      - name: Build the PostgreSQL 17 package
        run: cargo pgrx package --pg-config "${PG_CONFIG}" --out-dir package

      - name: Build the v0.1.0 package
        working-directory: upgrade-baseline
        run: cargo pgrx package --pg-config "${PG_CONFIG}" --out-dir "${GITHUB_WORKSPACE}/legacy-package"

      - name: Verify the candidate package on fresh and upgraded databases
        run: bash tests/package_smoke.sh package legacy-package

      - name: Create a release archive and checksum
        id: archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          archive="geometry_pyramid-${TAG}-pg17-ubuntu-24.04-x86_64.tar.gz"
          tar --directory package --create --gzip --file "dist/${archive}" .
          (
            cd dist
            sha256sum "${archive}" > "${archive}.sha256"
          )
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload the verified archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geometry-pyramid-pg17
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geometry-pyramid-pg17
          path: dist

      - name: Create or update the GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          ARCHIVE: ${{ needs.verify.outputs.archive }}
        run: |
          checksum="${ARCHIVE}.sha256"
          sha256sum --check "${checksum}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" "${checksum}" --clobber
          else
            gh release create "${TAG}" --verify-tag --title "geometry_pyramid ${TAG}" --generate-notes "${ARCHIVE}" "${checksum}"
          fi
