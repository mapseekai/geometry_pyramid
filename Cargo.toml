[package]
name = "geometry_pyramid"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PostgreSQL extension that builds vector tile pyramids over geometry tables, inspired by Alibaba GanosBase ganos_geometry_pyramid."
repository = "https://github.com/zwishing/geometry_pyramid"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo-types = "0.7"
geo = "0.30"
geozero = { version = "0.14", features = ["with-mvt", "with-wkb", "with-geojson"] }
prost = "0.13"
byteorder = "1.5"
thiserror = "2"

[dev-dependencies]
pgrx-tests = "=0.16.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
